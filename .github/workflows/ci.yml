name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloudvault
          POSTGRES_PASSWORD: cloudvault
          POSTGRES_DB: cloudvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudvault -d cloudvault_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://cloudvault:cloudvault@localhost:5432/cloudvault_test
      TEST_DATABASE_URL: postgresql+asyncpg://cloudvault:cloudvault@localhost:5432/cloudvault_test
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Lint with ruff
        run: |
          ruff check .
      - name: Test with pytest
        run: |
          pytest
      - name: Verify PostgreSQL migrations
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and start stack
        run: |
          docker compose config --quiet
          docker compose up --build -d
      - name: Verify frontend and proxied API
        run: |
          curl --fail --retry 30 --retry-delay 3 --retry-all-errors http://localhost:3000/
          curl --fail --retry 30 --retry-delay 3 --retry-all-errors http://localhost:3000/api/v1/health
          curl --fail -X POST http://localhost:3000/api/v1/auth/register -H 'Content-Type: application/json' -d '{"email":"smoke@example.com","password":"smoke-test-password","full_name":"Smoke Test","tenant_name":"Smoke Workspace"}'
      - name: Verify object storage
        run: python scripts/docker_smoke.py
      - name: Verify real storage adapter contract in disposable buckets
        working-directory: ./backend
        run: |
          pip install -r requirements-dev.txt
          TEST_S3_ENDPOINT=http://localhost:9000 TEST_S3_ACCESS_KEY=minioadmin TEST_S3_SECRET_KEY=minioadmin python -m pytest tests/test_storage_integration.py tests/test_uploads_integration.py tests/test_multipart_integration.py -q
      - name: Verify Docker API upload with real SMTP
        run: python scripts/upload_smoke.py
      - name: Set up Node for real upload browser check
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Real upload browser check with disposable data and bucket
        working-directory: ./frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          TEST_S3_ENDPOINT=http://localhost:9000 TEST_S3_ACCESS_KEY=minioadmin TEST_S3_SECRET_KEY=minioadmin npx playwright test e2e/uploads.pw.ts e2e/multipart.pw.ts
      - name: Container logs
        if: always()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test --if-present
      - name: Build
        run: npm run build
      - name: Set up Python for account E2E stack
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install account E2E dependencies
        run: |
          python -m pip install -r ../backend/requirements.txt
          python -m pip install aiosqlite
          npx playwright install --with-deps chromium
      - name: Account browser journeys with real localhost SMTP
        run: npm run test:e2e
