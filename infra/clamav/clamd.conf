Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
PidFile /tmp/clamd.pid
TemporaryDirectory /tmp
MaxThreads 1
MaxQueue 2
ReadTimeout 90
CommandReadTimeout 5
SendBufTimeout 1000
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 200M
MaxRecursion 16
MaxFiles 1000
MaxScanTime 60000
AlertExceedsMax yes
AlertEncrypted yes
AlertOLE2Macros yes
AlertBrokenExecutables yes
AlertBrokenMedia yes
ConcurrentDatabaseReload no
SelfCheck 60
LogTime yes
LogClean no
LogVerbose no
ScanArchive yes
