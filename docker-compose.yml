services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudvault
      POSTGRES_PASSWORD: cloudvault
      POSTGRES_DB: cloudvault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudvault"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloudvault-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloudvault-network

  minio:
    build:
      context: ./infra/minio
      target: server
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloudvault-network

  minio-setup:
    build:
      context: ./infra/minio
      target: client
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      mc mb myminio/cloudvault --ignore-existing
      "
    networks:
      - cloudvault-network

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment: &backend-environment
      - DATABASE_URL=postgresql+asyncpg://cloudvault:cloudvault@postgres:5432/cloudvault
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - SECRET_KEY=change-me-in-development-only
      - ENVIRONMENT=development
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - FRONTEND_URL=http://localhost:3000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    networks:
      - cloudvault-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - cloudvault-network

  email-worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.jobs.deliver_email"]
    environment: *backend-environment
    depends_on:
      backend:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: on-failure
    networks:
      - cloudvault-network

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cloudvault-network

volumes:
  postgres_data:
  minio_data:

networks:
  cloudvault-network:
    driver: bridge
