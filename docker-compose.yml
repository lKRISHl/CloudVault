services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudvault
      POSTGRES_PASSWORD: cloudvault
      POSTGRES_DB: cloudvault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudvault"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloudvault-network

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 256m
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloudvault-network

  minio:
    build:
      context: ./infra/minio
      target: server
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:43000"
      MINIO_API_STALE_UPLOADS_EXPIRY: "24h"
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: "1h"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloudvault-network

  minio-setup:
    build:
      context: ./infra/minio
      target: client
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      mc mb myminio/cloudvault --ignore-existing &&
      mc anonymous set none myminio/cloudvault
      "
    networks:
      - cloudvault-network

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - preview_ipc:/preview:ro
    environment: &backend-environment
      - DATABASE_URL=postgresql+asyncpg://cloudvault:cloudvault@postgres:5432/cloudvault
      - REDIS_URL=redis://redis:6379/0
      - CLAMD_HOST=clamav
      - CLAMD_PORT=3310
      - SCAN_MAX_BYTES=${SCAN_MAX_BYTES:-104857600}
      - SCAN_TIMEOUT_SECONDS=${SCAN_TIMEOUT_SECONDS:-90}
      - SCAN_DEFINITION_MAX_AGE_SECONDS=${SCAN_DEFINITION_MAX_AGE_SECONDS:-86400}
      - STORAGE_STAGE_BATCH_SIZE=${STORAGE_STAGE_BATCH_SIZE:-5}
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=http://localhost:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=cloudvault
      - S3_REGION=us-east-1
      - S3_ADDRESSING_STYLE=path
      - DOWNLOAD_URL_SECONDS=${DOWNLOAD_URL_SECONDS:-300}
      - MULTIPART_MAX_BYTES=${MULTIPART_MAX_BYTES:-1073741824}
      - MULTIPART_PART_BYTES=${MULTIPART_PART_BYTES:-8388608}
      - MULTIPART_UPLOAD_SECONDS=${MULTIPART_UPLOAD_SECONDS:-3600}
      - UPLOAD_CLEANUP_INTERVAL_SECONDS=${UPLOAD_CLEANUP_INTERVAL_SECONDS:-60}
      - UPLOAD_CLEANUP_SETTLE_SECONDS=${UPLOAD_CLEANUP_SETTLE_SECONDS:-300}
      - SECRET_KEY=change-me-in-development-only
      - ENVIRONMENT=development
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - FRONTEND_URL=http://localhost:3000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      preview-renderer:
        condition: service_healthy
    networks:
      - cloudvault-network

  preview-init:
    build:
      context: ./backend
    user: "0:0"
    command: ["python", "-c", "import os; os.chown('/preview',1000,1000); os.chmod('/preview',0o700)"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    volumes:
      - preview_ipc:/preview

  preview-renderer:
    build:
      context: ./backend
      target: preview-renderer
    command: ["python", "-m", "app.previews.server"]
    user: "1000:1000"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 512m
    cpus: 1
    tmpfs:
      - /tmp:size=32m,mode=0700,uid=1000,gid=1000,noexec,nosuid,nodev
    volumes:
      - preview_ipc:/preview
    depends_on:
      preview-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.connect('/preview/renderer.sock'); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - cloudvault-network

  preview-worker:
    build:
      context: ./backend
    command: ["celery", "-A", "app.jobs.celery_app:celery_app", "worker", "--loglevel=WARNING", "--pool=prefork", "--concurrency=1", "--queues=previews", "--hostname=previews@%h"]
    environment: *backend-environment
    volumes:
      - preview_ipc:/preview:ro
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      preview-renderer:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-m", "app.jobs.check_jobs", "--job", "previews"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - cloudvault-network

  email-worker:
    build:
      context: ./backend
    command: ["celery", "-A", "app.jobs.celery_app:celery_app", "worker", "--loglevel=WARNING", "--pool=prefork", "--concurrency=1", "--queues=email", "--hostname=email@%h"]
    environment: *backend-environment
    depends_on:
      backend:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.jobs.check_jobs", "--job", "email"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: on-failure
    networks:
      - cloudvault-network

  upload-cleanup:
    build:
      context: ./backend
    command: ["celery", "-A", "app.jobs.celery_app:celery_app", "worker", "--loglevel=WARNING", "--pool=prefork", "--concurrency=1", "--queues=storage", "--hostname=storage@%h"]
    environment: *backend-environment
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.jobs.check_jobs", "--job", "storage"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 720s
    restart: on-failure
    networks:
      - cloudvault-network

  job-scheduler:
    build:
      context: ./backend
    command: ["celery", "-A", "app.jobs.celery_app:celery_app", "beat", "--loglevel=WARNING", "--schedule=/tmp/celerybeat-schedule", "--pidfile=/tmp/celerybeat.pid"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_CLEANUP_INTERVAL_SECONDS=${UPLOAD_CLEANUP_INTERVAL_SECONDS:-60}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=8m,mode=0700,uid=1000,gid=1000,noexec,nosuid,nodev
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    networks:
      - cloudvault-network

  clamav:
    build:
      context: ./infra/clamav
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 3g
    cpus: 1
    environment:
      TZ: UTC
    volumes:
      - clamav_signatures:/var/lib/clamav:ro
    tmpfs:
      - /tmp:size=512m,mode=1777,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 180s
    restart: on-failure
    networks:
      - scan-network

  clamav-updater:
    build:
      context: ./infra/clamav
    entrypoint: ["freshclam"]
    command: ["--daemon", "--foreground=true", "--stdout", "--config-file=/etc/clamav/freshclam.conf"]
    # The parent image probes clamd, which is not in the updater container.
    # scan-worker probes the daemon's loaded definition freshness instead.
    healthcheck:
      disable: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    cpus: 1
    environment:
      TZ: UTC
    volumes:
      - clamav_signatures:/var/lib/clamav
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    restart: on-failure
    networks:
      - cloudvault-network

  scan-worker:
    build:
      context: ./backend
    command: ["celery", "-A", "app.jobs.celery_app:celery_app", "worker", "--loglevel=WARNING", "--pool=prefork", "--concurrency=1", "--queues=scans", "--hostname=scans@%h"]
    environment: *backend-environment
    mem_limit: 512m
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.jobs.check_jobs", "--job", "scans", "--scanner"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    restart: on-failure
    networks:
      - cloudvault-network
      - scan-network

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cloudvault-network

volumes:
  postgres_data:
  minio_data:
  preview_ipc:
  redis_data:
  clamav_signatures:

networks:
  scan-network:
    internal: true
  cloudvault-network:
    driver: bridge
